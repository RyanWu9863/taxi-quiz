<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>計程車考照刷題本</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: single phone-width column; sticky top bar with three tabs; the active question is one card with big answer buttons. Accent is taxi-body yellow (色卡 1之18號純黃). */
:root{
  --bg:#F2F3F1; --surface:#FFFFFF; --fg:#17191B; --muted:#62676C; --line:#DADCD8;
  --taxi:#F5C400; --on-taxi:#17191B; --taxi-soft:#FFF4C2;
  --good:#1D7F47; --good-soft:#E3F3E9; --bad:#C2352B; --bad-soft:#FBE7E5;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121315; --surface:#1C1E21; --fg:#ECEDEA; --muted:#A0A5AA; --line:#33363A;
  --taxi:#F2C230; --on-taxi:#17191B; --taxi-soft:#3A3217;
  --good:#5CC48A; --good-soft:#1A3326; --bad:#F07A70; --bad-soft:#3C1F1D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121315; --surface:#1C1E21; --fg:#ECEDEA; --muted:#A0A5AA; --line:#33363A;
  --taxi:#F2C230; --on-taxi:#17191B; --taxi-soft:#3A3217;
  --good:#5CC48A; --good-soft:#1A3326; --bad:#F07A70; --bad-soft:#3C1F1D; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--taxi)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--taxi);color:var(--on-taxi)}
.bar-in{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{margin:0;font-size:1.15rem;font-weight:900;letter-spacing:.04em;text-wrap:balance}
.brand .plate{font-family:var(--font-num);font-size:.72rem;font-weight:600;border:1.5px solid var(--on-taxi);border-radius:4px;padding:0 6px;letter-spacing:.08em}
nav.tabs{display:flex;gap:4px;margin-top:8px}
nav.tabs button{flex:1;border:0;background:transparent;color:var(--on-taxi);font:inherit;font-weight:700;font-size:.95rem;padding:8px 4px 10px;border-bottom:3px solid transparent;cursor:pointer}
nav.tabs button[aria-selected="true"]{border-bottom-color:var(--on-taxi)}
nav.tabs button:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.tabs .count{font-family:var(--font-num);font-size:.75rem;font-weight:600;margin-left:4px}
section[role="tabpanel"]{display:flex;flex-direction:column;gap:16px}
h2{font-size:1.05rem;margin:0;font-weight:700}
.label{font-size:.78rem;color:var(--muted);letter-spacing:.06em;font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.field{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:.95rem;font-weight:500;border-radius:999px;padding:6px 14px;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:10px;font:inherit;font-weight:700;font-size:1rem;padding:12px 18px;cursor:pointer;min-height:48px}
.btn.primary{background:var(--taxi);color:var(--on-taxi)}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--font-num);font-size:1.35rem;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:.78rem;color:var(--muted)}
.meter{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--taxi)}
input[type=number]{font:inherit;font-family:var(--font-num);width:6em;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.check{display:flex;align-items:center;gap:8px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--fg)}
.q-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:.78rem;font-weight:700;background:var(--taxi-soft);color:var(--fg);border-radius:6px;padding:2px 8px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--muted)}
.question{font-size:1.15rem;line-height:1.7;font-weight:500;margin:4px 0 0;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.tf{flex-direction:row}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:1.02rem;border-radius:12px;padding:12px 14px;min-height:56px;cursor:pointer}
.opts.tf .opt{justify-content:center;font-size:1.3rem;font-weight:700}
.opt .k{font-family:var(--font-num);font-weight:600;flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;font-size:.85rem}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--fg)}
.opt.right .k{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.verdict{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.05rem}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:.88rem}
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
.wl{display:flex;flex-direction:column;gap:0;padding:0}
.wl li{list-style:none;padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.wl li:first-child{border-top:0}
.wl .a{font-weight:700;color:var(--good)}
.cs-sec{display:flex;flex-direction:column;gap:0;padding:0;overflow:hidden}
.cs-sec h3{margin:0;padding:12px 16px;font-size:1rem;background:var(--taxi-soft)}
.cs-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 16px;border-top:1px solid var(--line)}
.cs-item .v{font-family:var(--font-num);font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.cs-item .v.long{white-space:normal;font-family:var(--font-body);font-weight:700}
.cs-item .trap{grid-column:1/-1;font-size:.84rem;color:var(--bad)}
.cs-item .trap::before{content:"陷阱　";font-weight:700}
.cs-item .note{grid-column:1/-1;font-size:.84rem;color:var(--muted)}
.sync{font-size:.78rem;color:var(--muted)}
@media (max-width:420px){.cs-item{grid-template-columns:1fr}.cs-item .v{text-align:left;white-space:normal}}
@media (prefers-reduced-motion:no-preference){.opt{transition:background-color .12s,border-color .12s}}
</style>

<header class="bar">
  <div class="bar-in">
    <div class="brand"><h1>計程車考照刷題本</h1><span class="plate">TAXI</span></div>
    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-practice" aria-controls="p-practice" aria-selected="true">刷題</button>
      <button role="tab" id="tab-wrong" aria-controls="p-wrong" aria-selected="false">錯題本<span class="count" id="wrongCount">0</span></button>
      <button role="tab" id="tab-cheat" aria-controls="p-cheat" aria-selected="false">數字小抄</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section role="tabpanel" id="p-practice" aria-labelledby="tab-practice">
    <div id="setup" class="card" style="display:flex;flex-direction:column;gap:16px">
      <div class="field"><span class="label">科目</span><div class="chips" id="subjChips"></div></div>
      <div class="field"><span class="label">題型</span><div class="chips" id="kindChips"></div></div>
      <div class="field"><span class="label">出題順序</span>
        <div class="chips" id="orderChips"></div>
        <div class="row" id="startRow"><label for="startAt" class="muted">從第</label><input type="number" id="startAt" min="1" value="1"><span class="muted">題開始</span></div>
      </div>
      <label class="check"><input type="checkbox" id="onlyWrong"> 只練這個範圍的錯題</label>
      <div class="field">
        <div class="stats" id="rangeStats"></div>
        <div class="meter" aria-hidden="true"><i id="rangeMeter" style="width:0"></i></div>
      </div>
      <div class="row"><button class="btn primary" id="startBtn">開始作答</button><span class="sync" id="syncNote"></span></div>
    </div>

    <div id="quiz" hidden style="display:flex;flex-direction:column;gap:16px">
      <div class="card" style="display:flex;flex-direction:column;gap:14px">
        <div class="q-top"><span class="tag" id="qTag"></span><span class="num" id="qPos"></span></div>
        <p class="question" id="qText"></p>
        <div class="opts" id="qOpts"></div>
        <div id="qResult" hidden style="display:flex;flex-direction:column;gap:6px">
          <div class="verdict" id="qVerdict"></div>
          <span class="muted" id="qMeta"></span>
        </div>
      </div>
      <div class="foot">
        <button class="btn ghost" id="quitBtn">結束</button>
        <span class="num" id="scoreNow"></span>
        <button class="btn primary" id="nextBtn" disabled>下一題</button>
      </div>
    </div>

    <div id="summary" class="card" hidden style="display:flex;flex-direction:column;gap:12px">
      <h2>這回合結束</h2>
      <div class="stats" id="sumStats"></div>
      <div class="row"><button class="btn primary" id="againBtn">再刷一次</button><button class="btn ghost" id="toWrongBtn">看錯題本</button><button class="btn ghost" id="backBtn">回設定</button></div>
    </div>
  </section>

  <section role="tabpanel" id="p-wrong" aria-labelledby="tab-wrong" hidden>
    <div class="row" style="justify-content:space-between"><h2>錯題本</h2><span class="muted">再答對一次就會移出</span></div>
    <div class="chips" id="wrongFilter"></div>
    <div id="wrongList"></div>
  </section>

  <section role="tabpanel" id="p-cheat" aria-labelledby="tab-cheat" hidden>
    <div class="row" style="justify-content:space-between"><h2>交通法令數字小抄</h2><span class="muted">紅字是題庫常見的錯誤寫法</span></div>
    <div id="cheat" style="display:flex;flex-direction:column;gap:16px"></div>
    <p class="muted">依題庫答案整理（警政署計程車駕駛人服務網，2026-10-22 下載）。標「題庫答案」的兩項與現行法規可能不同，考試請照題庫答。</p>
  </section>
</main>

const BANKS = [{"id":"traffic_tf","area":"traffic","name":"交通法令","kind":"tf","qs":[[1,"臨時停車係指車輛因上、下人、客、裝卸物品,其引擎未熄火,停止時間未滿10分鐘,保持立即行駛之狀態。",1],[2,"為維護道路交通安全與暢通,警察機關於必要時,得指定某線道路禁止車輛通行。",0],[3,"為維護道路交通安全與暢通,警察機關於必要時,得禁止停車及臨時停車。",0],[4,"道路因遇突發事故,足使交通陷於停滯時,執行交通勤務之警察,得調撥車道讓車輛通行。",0],[5,"違規停車之取締,不得由交通助理人員逕行執行之。",1],[6,"汽車駕駛人闖平交道,不得逕行舉發。",1],[7,"汽車駕駛人搶越行人穿越道,得逕行舉發。",0],[8,"汽車駕駛人違規停車,經各級學校交通服務隊現場導護人員簽證檢舉者,得逕行舉發。",0],[9,"汽車駕駛人聞救護車之警號不立即避讓者,得逕行舉發。",0],[10,"經以科學儀器取得證據資料證明汽車駕駛人行為違規者,得逕行舉發。",0],[11,"汽車駕駛人違規超車之行為,不得以移動式相機取得之證據,據以逕行舉發。",1],[12,"汽車駕駛人未依規定變換車道之違規行為,不得以移動式相機取得之證據,據以逕行舉發。",1],[13,"汽車駕駛人行車超速之違規行為,不得以移動式相機取得之證據,據以逕行舉發。",1],[14,"汽車駕駛人未依規定繫安全帶之違規行為,不得以移動式相機取得之証據,據以逕行舉發。",1],[15,"交通違規之受處罰人接獲違反道路交通管理事件通知單後,不服舉發事實者,應於30日內,向處罰機關陳述意見。",0],[16,"交通違規之受處罰人未依通知所定期限前往指定處所聽候裁決,且未依規定期限繳納罰鍰結案者,處罰機關得逕行裁決之。",0],[17,"汽車駕駛人未繳清其所有違反道路交通管理處罰條例之罰鍰前,不得向公路監理機關辦理各項登記。",0],[18,"車輛駕駛人違反道路交通管理處罰條例,依法應負刑事責任者,一律移送該管地方法院檢察署處理。",0],[19,"報廢登記之汽車仍行駛者,除罰鍰及禁止行駛外,其車輛並沒入之。",0],[20,"變造汽車牌照,使不能辨認其牌號,處汽車所有人新臺幣2,400元以上,4,800元以下罰鍰,並責令申請換領牌照。",0],[21,"塗改客車車身標明之載客人數,與原核定數量不符,處汽車所有人新臺幣2,400元以上,4,800元以下罰鍰,並責令改正。",0],[22,"引擎號碼,與原登記位置不符,處汽車駕駛人新臺幣2,400元以上4,800元以下罰鍰,並責令申改正。",1],[23,"牌照遺失,不報請公路主管機關補發,處汽車所有人新臺幣300元以上600元以下罰鍰,並可禁止其行駛。",0],[24,"號牌污穢,非行車途中因遇雨、雪道路泥濘所致,處汽車所有人新臺幣300元以上600元以下罰鍰,並責令改正。",0],[25,"計程車應裝置自動計費器、車頂燈、執業登記證插座,缺一不可。",0],[26,"計程車不可在前、後兩邊玻璃門上黏貼不透明反光紙。",0],[27,"汽車逾期2個月以上未參加定期檢驗者,除依規定罰鍰外,並吊扣其牌照,至檢驗合格後發還。",1],[28,"汽車逾期6個月以上未參加定期檢驗者,除依規定罰鍰外,並註銷其牌照。",0],[29,"經檢驗不合格之汽車,於3個月內仍未修復並申請覆驗,或覆驗仍不合格者,吊扣其牌照。",1],[30,"汽車因交通事故遭受重大損壞修復後,應申請公路主管機關施行臨時檢驗。",0],[31,"汽車所有人在1年內違反「應施行臨時檢驗」規定2次以上者,除依規定罰鍰外,並吊扣牌照3個月。",0],[32,"駕駛執照業經吊銷、註銷仍駕車之違規,駕駛執照應扣繳之。",0],[33,"駕駛執照吊扣期間駕車之違規,應吊銷其駕駛執照。",0],[34,"汽車駕駛人闖越平交道,應接受道路交通安全講習。",0],[35,"公路主管機關對於道路交通法規之重大修正,必要時得通知職業汽車駕駛人參加道路交通安全講習。",0],[36,"汽車駕駛人違規,依規定需受講習,無故不到者處罰鍰。經再通知依限參加講習,逾期6個月以上仍不參加者,吊扣其駕駛執照6個月。",0],[37,"職業汽車駕駛人,不依規定期限參加駕駛執照審驗,逾期半年以上者,逕行註銷其駕駛執照。",1],[38,"因未參加駕駛執照審驗,經逕行註銷駕駛執照之職業汽車駕駛人,得申請換發同等車類之普通駕駛執照。",0],[39,"在設有禁止變換車道線之路段,可以迴車載客。",1],[40,"汽車駕駛人於行駛道路時,以手持方式使用行動電話、電腦或其他相類功能裝置進行撥接、通話、數據通訊或其他有礙駕 理執業登記前,應接受執業相關法令及執業地之地理環境、道路狀況測驗,測驗成績以滿60分為及格。",1],[201,"聞消防車、救護車、警備車、工程救險車之警號時,應在原車道慢速行駛。",1],[202,"依道路交通安全規則規定,考領職業駕駛執照須年滿20歲、最高不得超過65歲。",0],[203,"在市區交通頻繁處,汽車在同一方向行駛時,前車與後車應保持二車以上之距離。",1],[204,"行駛高速公路時,如發生緊急情況無法繼續行駛時,應滑離車道,在路肩上停車待援。",0],[205,"在高速公路最高速限每小時90公里以上之路段,行駛速率低於每小時80公里之小型較慢速車輛,應行駛於外側車道。但得暫時利用緊鄰外側車道之車道超越前車。",0],[206,"汽車行駛高速公路及快速公路前，應妥為檢查車輛，在行駛途中不得有下列情形：四輪以上汽車的輪胎胎面磨損至中華民國國家標準 CNS 1431汽車用外胎（輪胎）標準或CNS4959卡客車用翻修輪胎標準所訂之任一胎面磨耗指示點。",0],[207,"小型車行駛高速公路之車輛與前車應保持足夠安全距離,車速每小時60公里時保持30公尺以上距離,車速每小時90公里應保持45公尺以上距離。",0],[208,"因隧道內車道壅塞,可變換至較少車輛之車道行駛,以紓解車流量。",1],[209,"汽車在隧道內遇事故時,儘可能將車輛停放於路邊設置之緊急停車彎,並開啟危險警告燈。",0],[210,"行經長隧道,當交通壅塞或發生緊急事故時,應利用車行聯絡隧道逕行迴車,趕快駛離現場。",1],[211,"交通案件之處罰其刑事責任部分,仍適用刑事法律有關規定處理之。",0],[212,"發生道路交通事故但無人傷亡且車輛尚能行駛,或有人受傷且當事人均同意移置車輛時,不須先標繪車輛位置及現場痕跡證據,即可將車輛移置不妨礙交通之處所。",1],[213,"發生道路交通事故其地點在高速公路時,應於距離事故地點後方100公尺處豎立車輛故障標誌或其他明顯警告設施。",0],[214,"發生道路交通事故其地點在最高速限50公里以下之路段,應於事故地點後方50公尺處,豎立車輛故障標誌或其他明顯警告設施。",1],[215,"道路交通事故案件當事人或利害關係人,於發生事故時不得申請提供道路交通事故當事人登記聯單。",1],[216,"道路交通事故資料之閱覽應於警察機關之辦公處所為之,不得攜出或塗改增刪;警察機關得以複印或備份方式提供現場照片。",0],[217,"汽車行駛高速公路或快速公路,內側車道為超車道,但小型車於不堵塞行車之狀況下,得以該路段容許之最高速限行駛於內側車道。",0],[218,"汽車行駛高速公路或快速公路在行駛途中,除遇特殊狀況必須減速外,不得驟然減速或在車道中臨時停車或停車。",0],[219,"汽車在行駛途中,不得驟然或任意變換車道,如欲超越前車或變換車道時,應先顯示方向燈告知前後車輛,並保持安全距離及間隔,方得超越或變換車道。",0],[220,"汽車行駛高速公路及快速公路,遇有濃霧、濃煙、強風、大雨等特殊狀況嚴重影響行車安全時,得在路肩暫停,並應顯示危險警告燈,視線清晰時,應即恢復行駛。",0],[221,"汽車行駛交通阻塞之路段,除應遵守交通勤務警察指揮外,駕駛人不得以任何理由將車輛暫停或停駐路肩,以免阻礙消防車、警備車、救護車,工程車及救濟車進入現場清理或急救。",0],[222,"為維護高速公路或快速公路交通安全與暢通,高速公路及快速公路管理機關或警察機關於必要時,得發布命令,指定時段於高速公路及快速公路特定匝道或路段之車道、路肩,禁止、限制或開放車輛通行。",0],[223,"分向限制線用以劃分路面成雙向車道,禁止車輛跨越行駛,並不得迴轉。",0],[224,"分向限制線,為雙黃實線,線寬及間隔均為10公分。",0],[225,"禁止變換車道線,為雙白實線,雙邊禁止變換。",0],[226,"禁止臨時停車線,本標線禁止時間為全日24小時,如有縮短之必要時,應以標誌及附牌標示之。",0],[227,"讓路線,用以警告車輛駕駛人前有幹道應減速慢行,或停車讓幹道車先行。",0],[228,"「停」標字,用以指示車輛至此必須停車再開。",0],[229,"開車的人無駕駛道德,是自己的不幸,也是別人的不幸。",0],[230,"兩個乘客上車後從竊竊私語中發現他們是販賣毒品的人,我們為了為國除害,一定要設法向警察機關報案不使他們逃走。",0],[231,"閃光黃燈表示「停車再開」,車輛應減速慢行,注意安全,小心通過。",1],[232,"閃光紅燈表示「警告」,車輛應減速接近,先停止於交岔路口前,讓幹道車優先通行後認為安全時,方得續行。",1],[233,"車種專用車道標線,用以指示僅限於某車種行駛之專用車道 const $ = s => document.querySelector(s);
const BY_ID = Object.fromEntries(BANKS.map(b => [b.id, b]));
const SUBJECTS = [{id:'traffic', name:'交通法令'}].concat(
  [...new Set(BANKS.filter(b=>b.area!=='traffic').map(b=>b.area))].map(a => ({id:a, name:BANKS.find(b=>b.area===a).name})));
const KINDS = [{id:'tf',name:'是非題'},{id:'mc',name:'選擇題'},{id:'both',name:'兩種都要'}];
const ORDERS = [{id:'rand',name:'隨機'},{id:'seq',name:'依序'}];

function lsGet(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

let ui = Object.assign({subj:'traffic', kind:'tf', order:'rand'}, lsGet('taxi-ui', {}));
// progress: wrong = Set of "bank:n", seen = {bank: Set(n)}
let prog = {wrong:new Set(), seen:{}};
function loadProg(raw){
  prog = {wrong:new Set(raw && raw.wrong || []), seen:{}};
  const s = raw && raw.seen || {};
  for (const k in s) prog.seen[k] = new Set(s[k]);
}
function progJSON(){
  const seen = {}; for (const k in prog.seen) seen[k] = [...prog.seen[k]];
  return {wrong:[...prog.wrong], seen, v:1};
}
loadProg(lsGet('taxi-prog', null));

// --- cloud sync (per-viewer, private) ---
let progRef = null, saveTimer = null, saving = false, dirty = false;
function scheduleSave(){
  lsSet('taxi-prog', progJSON());
  dirty = true;
  clearTimeout(saveTimer); saveTimer = setTimeout(flush, 1200);
}
async function flush(){
  if (!progRef || saving || !dirty) return;
  saving = true; dirty = false;
  try { await progRef.set(progJSON()); setSync('已同步到你的帳號'); }
  catch(e){ if (e && e.code === 'invalid_argument') { progRef = null; setSync('進度只存在這台裝置'); } else { dirty = true; setSync('同步暫時失敗，稍後再試'); } }
  saving = false;
  if (dirty) { clearTimeout(saveTimer); saveTimer = setTimeout(flush, 3000); }
}
function setSync(t){ $('#syncNote').textContent = t; }
setSync('進度存在這台裝置');
(async () => {
  try {
    const [db, user] = await Promise.all([window.claude?.use?.('db'), window.claude?.use?.('user')]);
    if (!db || !user) return;
    const uid = await user.id(); if (!uid) return;
    progRef = db.doc('data/users/' + uid + '/progress');
    const snap = await progRef.get();
    if (snap.exists) {
      const remote = snap.data();
      // merge local + remote so nothing done offline is lost
      const local = progJSON();
      const wrong = new Set([...(remote.wrong||[]), ...local.wrong]);
      const seen = {};
      for (const src of [remote.seen||{}, local.seen]) for (const k in src) { seen[k] = seen[k] || new Set(); src[k].forEach(n => seen[k].add(n)); }
      prog = {wrong, seen};
      lsSet('taxi-prog', progJSON());
      if (local.wrong.length || Object.keys(local.seen).length) { dirty = true; flush(); }
    } else if (prog.wrong.size || Object.keys(prog.seen).length) { dirty = true; flush(); }
    setSync('進度會同步到你的帳號');
    renderAll();
  } catch(e) { /* stay local */ }
})();

// --- question access ---
function q(bankId, n){
  const b = BY_ID[bankId], r = b.qs[n-1];
  return {bank:bankId, kind:b.kind, n:r[0], text:r[1], ans:r[2], opts:r[3], area:b.name};
}
function banksFor(subj, kind){
  return BANKS.filter(b => b.area === subj && (kind === 'both' || b.kind === kind));
}
function rangeKeys(subj, kind){
  const out = [];
  for (const b of banksFor(subj, kind)) for (const r of b.qs) out.push(b.id + ':' + r[0]);
  return out;
}

// --- setup UI ---
function chipRow(el, items, key){
  el.innerHTML = '';
  for (const it of items){
    const c = document.createElement('button');
    c.className = 'chip'; c.type = 'button'; c.textContent = it.name;
    c.setAttribute('aria-pressed', ui[key] === it.id ? 'true' : 'false');
    c.onclick = () => { ui[key] = it.id; lsSet('taxi-ui', ui); renderSetup(); };
    el.appendChild(c);
  }
}
function renderSetup(){
  chipRow($('#subjChips'), SUBJECTS, 'subj');
  chipRow($('#kindChips'), KINDS, 'kind');
  chipRow($('#orderChips'), ORDERS, 'order');
  $('#startRow').hidden = ui.order !== 'seq' || ui.kind === 'both';
  const keys = rangeKeys(ui.subj, ui.kind);
  let seen = 0, wrong = 0;
  for (const k of keys){ const [b,n] = k.split(':'); if (prog.seen[b] && prog.seen[b].has(+n)) seen++; if (prog.wrong.has(k)) wrong++; }
  $('#rangeStats').innerHTML =
    `<div class="stat"><b>${keys.length}</b><span>題數</span></div>`+
    `<div class="stat"><b>${seen}</b><span>做過</span></div>`+
    `<div class="stat"><b>${wrong}</b><span>錯題</span></div>`;
  $('#rangeMeter').style.width = keys.length ? (seen/keys.length*100).toFixed(1)+'%' : '0';
  const ow = $('#onlyWrong'); ow.disabled = wrong === 0; if (wrong === 0) ow.checked = false;
  $('#startAt').max = keys.length;
}

// --- quiz ---
let run = null;
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function startRun(keys){
  if (!keys.length) return;
  run = {keys, i:0, right:0, done:0, answered:false};
  show('quiz'); renderQ();
}
function startFromSetup(){
  let keys = rangeKeys(ui.subj, ui.kind);
  if ($('#onlyWrong').checked) keys = keys.filter(k => prog.wrong.has(k));
  if (ui.order === 'rand') shuffle(keys);
  else if (ui.kind !== 'both') { const s = Math.max(1, Math.min(keys.length, +$('#startAt').value || 1)); keys = keys.slice(s-1); }
  run && (run.origin = null);
  startRun(keys);
  run.origin = {type:'setup'};
}
function show(which){
  $('#setup').hidden = which !== 'setup';
  $('#quiz').hidden = which !== 'quiz';
  $('#summary').hidden = which !== 'summary';
  if (which === 'setup') renderSetup();
  window.scrollTo({top:0});
}
function renderQ(){
  const [b, n] = run.keys[run.i].split(':');
  const item = q(b, +n); run.cur = item; run.answered = false;
  $('#qTag').textContent = item.area + '・' + (item.kind === 'tf' ? '是非' : '選擇') + ' #' + item.n;
  $('#qPos').textContent = (run.i+1) + ' / ' + run.keys.length;
  $('#qText').textContent = item.text;
  const box = $('#qOpts'); box.innerHTML = '';
  box.className = 'opts' + (item.kind === 'tf' ? ' tf' : '');
  const labels = item.kind === 'tf' ? ['○ 是','✕ 否'] : item.opts;
  labels.forEach((t, idx) => {
    const o = document.createElement('button');
    o.type = 'button'; o.className = 'opt';
    if (item.kind === 'tf') o.textContent = t;
    else { const k = document.createElement('span'); k.className='k'; k.textContent = idx+1; const s = document.createElement('span'); s.textContent = t; o.append(k, s); }
    o.onclick = () => answer(idx);
    box.appendChild(o);
  });
  $('#qResult').hidden = true;
  $('#nextBtn').disabled = true;
  $('#nextBtn').textContent = run.i === run.keys.length-1 ? '看結果' : '下一題';
  $('#scoreNow').textContent = run.done ? `答對 ${run.right}/${run.done}` : '';
}
function answer(idx){
  if (run.answered) return;
  run.answered = true;
  const item = run.cur, ok = idx === item.ans, key = item.bank + ':' + item.n;
  run.done++; if (ok) run.right++;
  (prog.seen[item.bank] = prog.seen[item.bank] || new Set()).add(item.n);
  if (ok) prog.wrong.delete(key); else prog.wrong.add(key);
  scheduleSave();
  const btns = [...$('#qOpts').children];
  btns.forEach((b, i) => { b.disabled = true; if (i === item.ans) b.classList.add('right'); else if (i === idx) b.classList.add('wrong'); });
  const v = $('#qVerdict');
  v.className = 'verdict ' + (ok ? 'ok' : 'no');
  const ansText = item.kind === 'tf' ? (item.ans === 0 ? '是' : '否') : `(${item.ans+1}) ${item.opts[item.ans]}`;
  v.textContent = ok ? '答對了' : '答錯，正確答案是 ' + ansText;
  $('#qMeta').textContent = ok ? '' : '已加入錯題本';
  $('#qResult').hidden = false;
  $('#nextBtn').disabled = false; $('#nextBtn').focus({preventScroll:true});
  $('#scoreNow').textContent = `答對 ${run.right}/${run.done}`;
  $('#wrongCount').textContent = prog.wrong.size;
}
function next(){
  if (!run.answered) return;
  if (run.i < run.keys.length-1){ run.i++; renderQ(); window.scrollTo({top:0}); }
  else finish();
}
function finish(){
  const pct = run.done ? Math.round(run.right/run.done*100) : 0;
  $('#sumStats').innerHTML =
    `<div class="stat"><b>${run.done}</b><span>作答</span></div>`+
    `<div class="stat"><b>${run.right}</b><span>答對</span></div>`+
    `<div class="stat"><b>${pct}%</b><span>正確率</span></div>`;
  flush(); show('summary');
}
$('#startBtn').onclick = startFromSetup;
$('#nextBtn').onclick = next;
$('#quitBtn').onclick = () => run.done ? finish() : show('setup');
$('#againBtn').onclick = () => { if (run.origin && run.origin.type === 'wrong') startWrong(run.origin.bank); else startFromSetup(); };
$('#backBtn').onclick = () => show('setup');
$('#toWrongBtn').onclick = () => selectTab('wrong');
document.addEventListener('keydown', e => {
  if ($('#quiz').hidden || $('#p-practice').hidden) return;
  if (e.target.tagName === 'INPUT') return;
  const n = {'1':0,'2':1,'3':2,'o':0,'O':0,'x':1,'X':1}[e.key];
  if (n !== undefined && !run.answered && n < $('#qOpts').children.length) answer(n);
  else if ((e.key === 'Enter' || e.key === ' ') && run.answered){ e.preventDefault(); next(); }
});

// --- wrong book ---
let wrongBank = 'all';
function wrongByBank(){
  const m = {};
  for (const k of prog.wrong){ const [b,n] = k.split(':'); if (BY_ID[b]) (m[b] = m[b] || []).push(+n); }
  for (const b in m) m[b].sort((a,c)=>a-c);
  return m;
}
function bankLabel(id){ const b = BY_ID[id]; return b.name + (b.kind === 'tf' ? '是非' : '選擇'); }
function startWrong(bank){
  const m = wrongByBank(); let keys = [];
  for (const b of BANKS) if (m[b.id] && (bank === 'all' || bank === b.id)) keys.push(...m[b.id].map(n => b.id+':'+n));
  shuffle(keys);
  selectTab('practice');
  startRun(keys);
  if (run) run.origin = {type:'wrong', bank};
}
function renderWrong(){
  $('#wrongCount').textContent = prog.wrong.size;
  const m = wrongByBank();
  const ids = BANKS.map(b => b.id).filter(id => m[id]);
  if (wrongBank !== 'all' && !m[wrongBank]) wrongBank = 'all';
  const f = $('#wrongFilter'); f.innerHTML = '';
  const add = (id, name) => { const c = document.createElement('button'); c.type='button'; c.className='chip'; c.textContent=name; c.setAttribute('aria-pressed', wrongBank===id?'true':'false'); c.onclick=()=>{wrongBank=id; renderWrong();}; f.appendChild(c); };
  if (ids.length){ add('all', '全部 ' + prog.wrong.size); ids.forEach(id => add(id, bankLabel(id) + ' ' + m[id].length)); }
  const box = $('#wrongList'); box.innerHTML = '';
  if (!ids.length){ box.innerHTML = '<div class="card empty">還沒有錯題。去刷題，答錯的題目會自動收進來。</div>'; return; }
  const bar = document.createElement('div'); bar.className = 'row'; bar.style.marginBottom = '12px';
  const go = document.createElement('button'); go.className = 'btn primary'; go.type='button';
  go.textContent = '練習這些錯題'; go.onclick = () => startWrong(wrongBank);
  bar.appendChild(go); box.appendChild(bar);
  const list = document.createElement('ul'); list.className = 'card wl';
  for (const id of ids){
    if (wrongBank !== 'all' && wrongBank !== id) continue;
    for (const n of m[id]){
      const it = q(id, n);
      const li = document.createElement('li');
      const t = document.createElement('span'); t.className='num'; t.textContent = bankLabel(id) + ' #' + n;
      const p = document.createElement('span'); p.textContent = it.text;
      const a = document.createElement('span'); a.className='a';
      a.textContent = '答案：' + (it.kind==='tf' ? (it.ans===0?'是':'否') : `(${it.ans+1}) ${it.opts[it.ans]}`);
      li.append(t, p, a);
      if (it.kind === 'mc'){ const o = document.createElement('span'); o.className='muted'; o.textContent = it.opts.map((x,i)=>`(${i+1})${x}`).join('　'); li.insertBefore(o, a); }
      list.appendChild(li);
    }
  }
  box.appendChild(list);
}

// --- cheat sheet ---
function renderCheat(){
  const box = $('#cheat'); box.innerHTML = '';
  for (const sec of CHEAT){
    const d = document.createElement('div'); d.className = 'card cs-sec';
    const h = document.createElement('h3'); h.textContent = sec.t; d.appendChild(h);
    for (const [k, v, note] of sec.items){
      const r = document.createElement('div'); r.className = 'cs-item';
      const a = document.createElement('span'); a.textContent = k;
      const b = document.createElement('span'); b.className = 'v' + (v.length > 12 ? ' long' : ''); b.textContent = v;
      r.append(a, b);
      if (note){ const n = document.createElement('span'); n.className = /錯|不是/.test(note) ? 'trap' : 'note'; n.textContent = note; r.appendChild(n); }
      d.appendChild(r);
    }
    box.appendChild(d);
  }
}

// --- tabs ---
function selectTab(name){
  for (const t of ['practice','wrong','cheat']){
    $('#tab-'+t).setAttribute('aria-selected', t===name ? 'true':'false');
    $('#p-'+t).hidden = t !== name;
  }
  if (name === 'wrong') renderWrong();
  if (name === 'practice' && !$('#setup').hidden) renderSetup();
  window.scrollTo({top:0});
}
for (const t of ['practice','wrong','cheat']) $('#tab-'+t).onclick = () => selectTab(t);
function renderAll(){ renderSetup(); renderWrong(); }

renderCheat(); renderAll(); show('setup');
const h = (location.hash||'').slice(1); if (['wrong','cheat'].includes(h)) selectTab(h);
document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
</script>
</body></html>
